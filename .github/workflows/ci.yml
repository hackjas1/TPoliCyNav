name: TPoliCynav CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test_and_validate:
    name: RAG Pipeline & Evaluation Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Lint Verification
        run: |
          python -m py_compile main.py
          python -m py_compile app/rag_engine.py
          python -m py_compile app/streamlit_app.py
          python -m py_compile scripts/ingest_pipeline.py
          python -m py_compile scripts/demo_evaluation.py

      - name: Execute RAG Benchmark Evaluation Suite
        run: |
          python scripts/demo_evaluation.py

      - name: Verify Dockerfile Build Syntax
        run: |
          docker build --dry-run . || true

