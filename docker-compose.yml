version: '3.8'

services:
  tpolicynav-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tpolicynav_app
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-tpolicynav}
      - HF_TOKEN=${HF_TOKEN}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

